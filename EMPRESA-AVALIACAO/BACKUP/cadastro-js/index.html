<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./dist/output.css">
    <title>Cadastro de Alunos</title>
</head>
<body class="bg-gray-100 text-gray-800">
    
    <main class="max-w-lg mx-auto mt-10 p-6 bg-white rounded-lg shadow">

        <h1 class="">Cadastro de Alunos</h1>

        <form id="formAluno" class="space-y-4">
            <div>
                <label for="nome" class="block font-medium mb-1">Nome</label>
            
            <input 
            type="text" 
            id="nome"
            placeholder="Digite o nome"
            class="w-full border rounded px-3 py-2"
            required
            >
            </div>

            <div >
                <label for="nota" class="block font-medium mb-1">
                    Nota
                </label>
                <input 
                type="number" 
                id="nota"
                min="0"
                max="10"
                step="0.1"
                placeholder="Digite a nota"
                class="w-full border rounded px-3 py-2"
                >
            </div>
            <button
            type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-900"
            
            >Cadastrar
        </button>

        </form>

        <p id="mensagem" class="mt-4 text-sm"></p>
        <h2 class="text-xl font-semibold mt-8 mb-3">
            Lista de Alunos
        </h2>
        <ul id="listaAlunos" class="list-disc pl-5 space-y-1"></ul>

    </main>

    <script src="script.js"></script>
    
</body>
</html>
